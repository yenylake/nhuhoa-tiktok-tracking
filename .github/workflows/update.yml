name: Cập nhật dữ liệu TikTok

on:
  schedule:
    - cron: '0 3 * * *'   # 10:00 giờ Việt Nam (UTC+7)
  workflow_dispatch:       # Bấm "Run workflow" để cập nhật ngay

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Commit dữ liệu
        run: |
          git config user.name "tiktok-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Cập nhật dữ liệu $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')"
          git push
