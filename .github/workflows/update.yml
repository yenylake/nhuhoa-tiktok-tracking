name: Cập nhật dữ liệu TikTok

on:
  schedule:
    # 10:00 giờ VN = 03:00 UTC. GitHub có thể trễ/bỏ lịch giờ chẵn,
    # nên đặt nhiều mốc dự phòng; lần nào đã cập nhật xong thì các lần sau tự bỏ qua.
    - cron: '0 3 * * *'
    - cron: '10 3 * * *'
    - cron: '25 3 * * *'
    - cron: '45 3 * * *'
    - cron: '15 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:       # Bấm "Run workflow" để cập nhật ngay

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
        env:
          SKIP_IF_FRESH: ${{ github.event_name == 'schedule' && '1' || '' }}
      - name: Commit dữ liệu
        run: |
          git config user.name "tiktok-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Cập nhật dữ liệu $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')"
          git pull --rebase -q && git push
